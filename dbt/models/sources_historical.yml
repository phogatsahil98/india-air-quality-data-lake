version: 2

sources:
  - name: cpcb_silver_history
    description: >-
      Extraction-aware CPCB historical Silver observations. Each row belongs to
      one immutable Bronze extraction; repeated station-pollutant entities across
      different extractions are intentionally retained.
    database: awsdatacatalog
    schema: india_aqi_lake
    tables:
      - name: cpcb_observation_snapshots
        description: >-
          Historical CPCB observation snapshots stored as Parquet in S3 and
          registered as a partitioned AWS Glue external table. The partition
          column ingestion_date identifies the UTC date on which our extraction
          was retrieved, not the CPCB source observation date.
        columns:
          - name: extraction_id
            description: UTC extraction identifier in YYYYMMDDTHHMMSSZ format.
          - name: retrieved_at_utc
            description: UTC retrieval timestamp derived from the extraction ID.
          - name: ingestion_date
            description: UTC retrieval date and Glue partition key.
          - name: source_last_update_raw
            description: CPCB last_update value retained as supplied; timezone semantics are not assumed.
          - name: candidate_station_key
            description: SHA-256 key derived from normalized country, state, city and station names; not an official CPCB station ID.
          - name: candidate_entity_key
            description: SHA-256 key derived from the candidate station key and pollutant identifier.
          - name: source_record_hash
            description: SHA-256 hash of the original source fields before measurement normalization.
          - name: measurement_status
            description: Availability and numeric-validity classification for the three measurement fields.
          - name: coordinate_status
            description: Geographic coordinate validation status.
