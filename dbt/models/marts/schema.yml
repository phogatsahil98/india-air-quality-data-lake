version: 2

models:
  - name: dim_city
    description: City reference dimension populated from the latest complete extraction.
    columns:
      - name: city_key
        description: Deterministic composite identifier from normalized country, state and city labels.
        data_tests: [not_null, unique]
      - name: city
        description: Original CPCB city label.
        data_tests: [not_null]
      - name: state
        description: State or union-territory label.
        data_tests: [not_null]

  - name: dim_station
    description: Monitoring-station dimension for stations present in the latest complete extraction.
    columns:
      - name: station_key
        description: Candidate key derived from normalized source station labels; not an official CPCB ID.
        data_tests: [not_null, unique]
      - name: station_name
        description: CPCB monitoring-station display name.
        data_tests: [not_null]

  - name: dim_pollutant
    description: Reference dimension for pollutant codes present in the latest extraction.
    columns:
      - name: pollutant_id
        description: CPCB pollutant code.
        data_tests: [not_null, unique]
      - name: pollutant_name
        description: Human-readable pollutant name.
        data_tests: [not_null]

  - name: fct_station_pollutant_observation
    description: >-
      Current-state fact containing one deduplicated row per source record in
      the latest complete extraction. Historical changes are represented by
      the separate snapshot comparison models.
    columns:
      - name: fact_observation_key
        description: Composite key from extraction_id and source_record_hash.
        data_tests: [not_null, unique]
      - name: city_key
        description: Foreign key to dim_city.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_city')
                field: city_key
      - name: station_key
        description: Candidate station foreign key to dim_station.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: station_key
      - name: pollutant_id
        description: Pollutant foreign key to dim_pollutant.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_pollutant')
                field: pollutant_id
      - name: ingestion_date
        description: UTC date when this latest snapshot was retrieved, not the source observation date.
        data_tests: [not_null]
      - name: extraction_id
        data_tests: [not_null]

  - name: mart_city_pollutant_snapshot
    description: City-pollutant concentration and availability summary for the latest complete extraction.
    columns:
      - name: city_key
        data_tests: [not_null]
      - name: pollutant_id
        data_tests: [not_null]
      - name: ingestion_date
        data_tests: [not_null]
      - name: measurement_availability_pct
        data_tests: [not_null]

  - name: mart_city_data_completeness
    description: City-level monitoring and measurement completeness for the latest complete extraction.
    columns:
      - name: city_key
        data_tests: [not_null]
      - name: ingestion_date
        data_tests: [not_null]
      - name: measurement_availability_pct
        data_tests: [not_null]
